<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>monkinator-frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Suppress MetaMask extension errors
      window.addEventListener('error', function(event) {
        if (event.message && event.message.includes('chrome.runtime.sendMessage')) {
          event.preventDefault();
          return false;
        }
      });
      
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && event.reason.message && event.reason.message.includes('chrome.runtime.sendMessage')) {
          event.preventDefault();
          return false;
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
