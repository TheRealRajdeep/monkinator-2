<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>monkinator-frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Suppress MetaMask extension errors and hydration issues
      window.addEventListener('error', function(event) {
        if (event.message && (
          event.message.includes('chrome.runtime.sendMessage') ||
          event.message.includes('hydration') ||
          event.message.includes('redacted') ||
          event.filename && event.filename.includes('hydration.js')
        )) {
          event.preventDefault();
          event.stopPropagation();
          return false;
        }
      });
      
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && event.reason.message && (
          event.reason.message.includes('chrome.runtime.sendMessage') ||
          event.reason.message.includes('hydration') ||
          event.reason.message.includes('redacted')
        )) {
          event.preventDefault();
          return false;
        }
      });

      // Suppress console errors for hydration
      const originalError = console.error;
      console.error = function(...args) {
        const message = args.join(' ');
        if (message.includes('hydration') || 
            message.includes('redacted') ||
            message.includes('hydration.js')) {
          return;
        }
        originalError.apply(console, args);
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
